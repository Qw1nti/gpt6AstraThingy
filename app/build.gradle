plugins { id 'com.android.application' }

android {
    namespace 'dev.veil.android'
    compileSdk 35
    defaultConfig {
        applicationId 'dev.veil.android'
        minSdk 35
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes { release { minifyEnabled false } }
    androidResources { noCompress 'onnx' }
    lint { abortOnError true }
}

dependencies { implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.21.0' }

tasks.register('verifyModel') {
    doLast {
        def model = file('src/main/assets/320n.onnx')
        if (!model.exists() || model.length() < 1000000) {
            throw new GradleException('Model missing. Run python3 scripts/fetch_model.py from the project root first.')
        }
    }
}
tasks.named('preBuild').configure { dependsOn 'verifyModel' }
