<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Veil interface preview</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080608;color:#ece9f0;font:14px Arial,sans-serif}.note{text-align:center;padding:12px;font-size:12px;color:#aaa2b1}.phone{max-width:412px;margin:0 auto;background:linear-gradient(135deg,#180015,#0c000b,#180014);min-height:820px;padding:16px}.nav{display:flex;height:68px;border-radius:14px;background:#191521;margin-bottom:20px;overflow:hidden}.nav button{width:20%;padding:10px 0 0;border:0;background:none;color:#938a9b;display:flex;flex-direction:column;align-items:center;gap:7px;border-bottom:2px solid transparent;font-size:11px}.nav button[aria-selected=true]{border-bottom-color:#ff0095;color:#ece9f0}.nav button[aria-selected=true] svg{color:#ff0095}.nav svg{width:21px;height:21px}.panel{background:#191521;padding:16px;border-radius:15px;margin-bottom:12px}.heading{font-size:16px;margin:0 0 7px;font-weight:400}.desc{font-size:12px;color:#aaa2b1;line-height:1.6;margin:0 0 6px}.action{width:100%;border:0;border-radius:5px;min-height:48px;color:#11000f;background:#ff0095;font-size:16px;letter-spacing:1px;margin-top:10px;padding:10px;cursor:pointer}.green{background:#b9f45a}.outline{background:transparent;color:#b9f45a;border:1px solid #b9f45a}.checks{display:grid;grid-template-columns:1fr 1fr;gap:0 8px}.check{display:flex;align-items:center;min-height:40px;gap:5px;font-size:13px;color:#aaa2b1}.check input{accent-color:#ff0095;width:19px;height:19px;margin:0 3px 0 0}select{display:block;width:100%;min-height:48px;border:0;background:#191521;color:#ece9f0;font-size:17px;padding:5px 8px}.slider{font-size:13px;color:#aaa2b1;display:block;margin-top:12px}input[type=range]{accent-color:#ff0095;width:100%;margin:14px 0}input[type=text]{background:#191521;border:1px solid #312939;color:#ece9f0;padding:12px;border-radius:7px;font-size:14px;width:100%}.footer{color:#aaa2b1;font-size:11px;text-align:center;padding:6px}.urlrow{display:flex;gap:8px}.urlrow .action{margin:0;width:60px}.toolbar{display:flex;margin:8px 0}.toolbar button{color:#aaa2b1;background:#191521;border:0;width:25%;height:40px;font-size:11px}.brand{text-align:center;padding:45px 15px}.brand strong{display:block;color:#ff0095;font-size:42px;letter-spacing:3px}.brand small{letter-spacing:2px;color:#aaa2b1}.brand p{line-height:1.6}.stage{height:160px;background:#747080;position:relative;border-radius:8px;margin-top:12px}.mask{position:absolute;left:25%;top:20%;width:50%;height:60%;background:black;color:white;display:flex;align-items:center;justify-content:center}.preview-msg{min-height:18px;color:#b9f45a;font-size:12px;margin-top:8px}button:disabled{opacity:.4;cursor:default}[hidden]{display:none!important}
</style></head><body><div class="note">Interface preview only — this does not run Android or detect content.</div><main class="phone"><nav class="nav" aria-label="App sections"></nav><section id="screen"></section></main>
<script>
const nav=document.querySelector('.nav'),screen=document.getElementById('screen');
const tabs=['Home','Settings','Browser','Help','Export'];
const icons=['<path d="M12 2 21 6 19 16Q16 21 12 23Q8 21 5 16L3 6Z"/><circle cx="12" cy="11" r="3"/>','<path d="M2 5h20M2 12h20M2 19h20"/><circle cx="15" cy="5" r="2"/><circle cx="8" cy="12" r="2"/><circle cx="15" cy="19" r="2"/>','<rect x="2" y="3" width="20" height="17" rx="2"/><path d="M2 8h20"/>','<circle cx="12" cy="12" r="10"/><path d="M9 8a3 3 0 0 1 6 1c0 2-3 2-3 5m0 3v1"/>','<path d="M12 2v14m-6-6 6 6 6-6M3 17v5h18v-5"/>'];
let chosen=0,enabled=true,style=0,inverted=false,padding=18,label='CENSORED';
const styles=['Solid','Diagonal pattern','Labeled','Box outline'];
const panel=(title,desc,body='')=>`<div class="panel"><h2 class="heading">${title}</h2>${desc?`<p class="desc">${desc}</p>`:''}${body}</div>`;
const button=(text,id,extra='')=>`<button class="action ${extra}" id="${id}">${text}</button>`;
const checkbox=(text,id,checked)=>`<label class="check"><input type="checkbox" id="${id}" ${checked?'checked':''}>${text}</label>`;
function render(){nav.innerHTML=tabs.map((t,i)=>`<button aria-selected="${i===chosen}" data-tab="${i}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">${icons[i]}</svg>${t}</button>`).join('');
if(chosen===0){screen.innerHTML=panel('Screen Capture Protection','Start or stop the screen capture service.',button('Start Protection','start','green')+'<div id="capture-message" class="preview-msg" aria-live="polite"></div>')+panel('AI Censoring','Detect and censor the categories you choose.',checkbox('Enable AI detection','enabled',enabled)+button('Censor style: '+styles[style],'style-open','outline')+'<p class="desc" style="margin-top:12px">Quick toggles</p><div class="checks">'+checkbox('Invert censor','invert',inverted)+checkbox('Show labels','labels',false)+'</div><label class="slider">Censor coverage: <span id="coverage">'+padding+'</span>%<input aria-label="Censor coverage" id="padding" type="range" min="0" max="70" value="'+padding+'"></label>')+panel('Performance','Choose a preset to match your device.','<select aria-label="Performance"><option>Low</option><option selected>Medium</option><option>High</option><option>Ultra</option></select>')+panel('Session','','<p class="desc">Protection is off</p><p class="desc">0 frames checked · 0 ms last scan</p><p class="desc">Use one-app capture. Detection can be delayed or miss content.</p>')+'<div class="footer">Veil 0.2 · On-device filtering</div>';
screen.querySelector('#start').onclick=()=>screen.querySelector('#capture-message').textContent='Android capture consent opens in the installed app.';screen.querySelector('#style-open').onclick=()=>{chosen=1;render()};screen.querySelector('#enabled').onchange=e=>enabled=e.target.checked;screen.querySelector('#invert').onchange=e=>inverted=e.target.checked;screen.querySelector('#padding').oninput=e=>{padding=+e.target.value;screen.querySelector('#coverage').textContent=padding};
}else if(chosen===1){const cats=['Genitals (F)','Genitals (M)','Breasts (Female)','Buttocks','Anus','Genitals (Covered)','Breasts (Covered)','Buttocks (Covered)','Anus (Covered)','All Faces','Chest (Male)','Belly/Stomach','Feet','Armpits'];screen.innerHTML=panel('Effects and packs','Preview your censor style or apply a saved look.',button('Censor Preview','preview')+button('Style Presets','presets')+'<div id="style-preview" hidden><div class="stage"><div class="mask" id="mask"></div></div></div>')+panel('Language','','<div style="padding:8px;font-size:18px">English</div>')+panel('Detection Categories','','<div class="checks">'+cats.map((c,i)=>checkbox(c,'cat-'+i,i<5)).join('')+'</div>')+panel('Censor Style','','<select aria-label="Censor style" id="style">'+styles.map((s,i)=>`<option ${style===i?'selected':''}>${s}</option>`).join('')+'</select><p class="desc">Box outline marks detections but does not hide their contents.</p>');screen.querySelector('#style').onchange=e=>{style=e.target.selectedIndex;paintMask()};screen.querySelector('#preview').onclick=()=>{screen.querySelector('#style-preview').hidden=!screen.querySelector('#style-preview').hidden;paintMask()};screen.querySelector('#presets').onclick=()=>{style=(style+1)%4;screen.querySelector('#style').selectedIndex=style;screen.querySelector('#style-preview').hidden=false;paintMask()};
}else if(chosen===2){screen.innerHTML=panel('Browser Settings','',checkbox('Enable AI detection','browser-ai',enabled)+'<p class="desc">Preview · no browsing or detection</p>')+'<div class="urlrow"><input aria-label="Address" type="text" placeholder="Search or enter URL">'+button('Go','go','green')+'</div><div class="toolbar">'+['Back','Reload','Tabs','Bookmarks'].map(t=>'<button>'+t+'</button>').join('')+'</div><div class="brand"><strong>VEIL</strong><small>FILTERED BROWSER</small><p>Enter an address above to start browsing.</p><p class="desc">Detection runs locally on page images.<br>This is a regular session. Cookies persist.</p></div><div class="preview-msg" id="browser-msg" aria-live="polite"></div>';screen.querySelector('#go').onclick=()=>screen.querySelector('#browser-msg').textContent='Web browsing is available in the Android app.';screen.querySelectorAll('.toolbar button').forEach(b=>b.onclick=()=>screen.querySelector('#browser-msg').textContent=b.textContent+' is available in the Android app.');
}else if(chosen===3){screen.innerHTML=panel('Permissions & battery','Appear-on-top permission lets Veil draw censor regions. Android asks for screen capture approval for each session.',button('Overlay Settings','overlay')+button('Battery Settings','battery'))+panel('Quick guide','1. Tap Start Protection on Home.<br>2. Choose one app in Android’s capture dialog.<br>3. Keep the app full screen.<br>4. Pick your categories and censor style in Settings.')+panel('If something looks wrong','Stop protection and start a new capture session. For offset boxes, try the vertical adjustment slider. Split screen and protected video are unsupported.')+panel('Privacy','Detection stays on your phone. No accounts, telemetry, uploads, or automatic recording.')+'<div class="preview-msg" id="help-msg" aria-live="polite"></div>';screen.querySelectorAll('.action').forEach(b=>b.onclick=()=>screen.querySelector('#help-msg').textContent='This opens Android settings in the installed app.');
}else{screen.innerHTML=panel('Export a censored image','Select an image, review detections, and save a censored PNG.',button('Choose photo','photo')+'<button class="action" disabled>Save PNG</button><p class="desc" style="margin-top:12px">Photos are processed on-device. Export resolution is limited to a 2048 px longest edge. Check for missed regions before sharing.</p><div class="preview-msg" id="photo-msg" aria-live="polite"></div>');screen.querySelector('#photo').onclick=()=>screen.querySelector('#photo-msg').textContent='The Android app opens the system photo picker.';}
nav.querySelectorAll('button').forEach(b=>b.onclick=()=>{chosen=+b.dataset.tab;render()});}
function paintMask(){const m=document.getElementById('mask');if(!m)return;m.style.background=style===3?'transparent':style===1?'repeating-linear-gradient(45deg,#000 0 10px,#403548 10px 14px)':'black';m.style.border=style===3?'3px solid #b9f45a':'none';m.textContent=style===2?label:'';}
render();
</script></body></html>
